name: CI
on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  build-linux-gcc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libcjson-dev pkg-config
      - name: build prayer-notify
        run: |
          make
        env:
          CC: gcc
  build-linux-clang:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libcjson-dev pkg-config
      - name: build prayer-notify
        run: |
          make
        env:
          CC: clang
  check-linux-format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: build prayer-notify

        run: |
          find src -name '*.c' -exec clang-format --dry-run --Werror "{}" \;
          find include -name '*.h' -exec clang-format --dry-run --Werror "{}" \;
        env:
          CC: clang
